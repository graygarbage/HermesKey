name: CI

on:
  push:
  pull_request:

jobs:
  lint-syntax-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck systemd

      - name: Shell syntax
        run: bash -n bin/hermeskey install.sh uninstall.sh scripts/check.sh scripts/build-release.sh

      - name: Shellcheck
        run: shellcheck bin/hermeskey install.sh uninstall.sh scripts/check.sh scripts/build-release.sh

      - name: Python syntax
        run: python3 -m py_compile bin/hermeskey-server.py bin/hermeskey-overlay.py

      - name: Verify systemd user units
        run: systemd-analyze --user verify systemd/user/hermeskey.service systemd/user/hermeskey-ydotoold.service

      - name: Build release archive
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: hermeskey-release-archive
          path: dist/*.tar.gz
