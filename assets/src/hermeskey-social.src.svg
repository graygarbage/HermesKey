<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Cantarell, Inter, 'DejaVu Sans', sans-serif">
  <!-- GitHub social preview (Settings > General > Social preview), 1280x640.
       Export: inkscape assets/src/hermeskey-social.src.svg -w 1280 -h 640 -o assets/hermeskey-social.png -->
  <rect width="1280" height="640" fill="#0f172a"/>

  <!-- Icon, centred -->
  <g transform="translate(540,78) scale(0.390625)">
    <rect width="512" height="512" rx="112" fill="#1e293b"/>
      <!-- Hermes wing -->
      <path transform="translate(278,150) scale(0.85)" fill="#f59e0b" d="M0 150 C 10 80, 70 20, 170 0 C 186 -3, 196 14, 184 24 C 168 38, 150 46, 128 52 C 150 52, 166 60, 162 74 C 158 86, 140 92, 108 96 C 124 100, 130 112, 122 122 C 108 138, 60 150, 0 150 Z"/>
      <!-- Keycap: side, then top face -->
      <rect x="60" y="128" width="258" height="264" rx="56" fill="#94a3b8"/>
      <rect x="80" y="134" width="218" height="226" rx="42" fill="#f8fafc"/>
      <!-- Voice -->
      <g fill="#1d4ed8">
        <rect x="106" y="229" width="22" height="36" rx="11"/>
        <rect x="142" y="207" width="22" height="80" rx="11"/>
        <rect x="178" y="185" width="22" height="124" rx="11"/>
        <rect x="214" y="207" width="22" height="80" rx="11"/>
        <rect x="250" y="229" width="22" height="36" rx="11"/>
      </g>
  </g>

  <g text-anchor="middle">
    <text x="640" y="382" font-size="92" font-weight="bold" fill="#f8fafc">Hermes<tspan fill="#f59e0b">Key</tspan></text>
    <text x="640" y="438" font-size="32" fill="#cbd5e1">Push-to-talk speech-to-text for Linux Wayland desktops</text>
  </g>

  <g font-size="20" fill="#cbd5e1" text-anchor="middle">
    <rect x="234" y="476" width="264" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="366" y="506">Local faster-whisper</text>
    <rect x="514" y="476" width="252" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="640" y="506">Types into any app</text>
    <rect x="782" y="476" width="264" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="914" y="506">KDE Plasma · Wayland</text>
  </g>

  <text x="640" y="590" font-size="22" fill="#64748b" text-anchor="middle">github.com/graygarbage/HermesKey</text>
</svg>
